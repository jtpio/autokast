name: Release

# Run from the Actions page. Sets the version, publishes the package to npm, pushes the version
# commit and the tag, and creates the GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'patch, minor, major, or an exact version such as 0.1.0'
        required: true
        default: patch

permissions:
  # npm trusted publishing (OIDC)
  id-token: write
  # Version commit, tag and GitHub release
  contents: write

concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - name: Set the version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --allow-same-version -m "Release v%s"
          echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ inputs.version }}
      - run: npm run typecheck
      - run: npm run build
      - name: Publish to npm
        run: |
          # A publication cannot be undone, so stop here if the push below cannot succeed.
          git push --dry-run --atomic origin "HEAD:$GITHUB_REF_NAME" "$TAG"
          # npm refuses a prerelease version on the "latest" dist-tag.
          npm publish --tag ${{ contains(env.TAG, '-') && 'next' || 'latest' }}
      - name: Push the version commit and the tag
        run: git push --atomic origin "HEAD:$GITHUB_REF_NAME" "$TAG"
      - name: Create the GitHub release
        run: gh release create "$TAG" --generate-notes --verify-tag --prerelease=${{ contains(env.TAG, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
